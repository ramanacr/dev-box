name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-quality:
    name: Web Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @toolbox/web lint
      - run: pnpm --filter @toolbox/web test
      - run: pnpm --filter @toolbox/web build
      - name: Verify Bundle Budgets
        run: node scripts/check-budgets.mjs

  server-quality:
    name: Server Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go vet ./...
      - run: go test -v -race ./...
      - run: go build -v ./cmd/toolbox-server

  docker-build-and-scan:
    name: Docker Build & Security Scans
    runs-on: ubuntu-latest
    needs: [web-quality, server-quality]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: developer-toolbox:ci
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: developer-toolbox:ci
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: developer-toolbox:ci
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
