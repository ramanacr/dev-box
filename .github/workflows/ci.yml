name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-quality:
    name: Web Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm comes from corepack, reading the version from package.json's
      # packageManager field - the same mechanism the Dockerfile uses, so the
      # image and CI cannot drift. pnpm/action-setup was doing this job until
      # its self-installer started failing on the Node 24 runner
      # ("self-installer exits with code 1"); corepack ships with Node and
      # needs no third-party action. This runs before setup-node because the
      # 'pnpm' cache key resolves the store directory by invoking pnpm.
      - run: corepack enable && corepack install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @toolbox/web lint
      - run: pnpm --filter @toolbox/web test
      - name: Test workspace packages
        run: pnpm --filter @toolbox/mcp-server test && pnpm --filter @toolbox/vscode test
      - run: pnpm --filter @toolbox/web build
      - name: Verify Bundle Budgets
        run: node scripts/check-budgets.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bundle-budget
          path: artifacts/bundle-budget.json
          if-no-files-found: ignore

  server-quality:
    name: Server Format, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      # internal/docs validates and searches the shipped content pack, which is a
      # build product. Without it those tests skip; CI is where they must run.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/build-core-pack.mjs
      # gofmt is a gate, not a suggestion: an unformatted tree hides real diffs in
      # review. `gofmt -l` prints offending files and the check fails if any are named.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -v -race ./...
      - run: go build -v ./cmd/toolbox-server

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: [web-quality, server-quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # pnpm comes from corepack, reading the version from package.json's
      # packageManager field - the same mechanism the Dockerfile uses, so the
      # image and CI cannot drift. pnpm/action-setup was doing this job until
      # its self-installer started failing on the Node 24 runner
      # ("self-installer exits with code 1"); corepack ships with Node and
      # needs no third-party action. This runs before setup-node because the
      # 'pnpm' cache key resolves the store directory by invoking pnpm.
      - run: corepack enable && corepack install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      - run: pnpm install --frozen-lockfile
      # The content pack is a build product, not a tracked file, so it has to be
      # built before anything that reads it. The e2e suite searches it.
      - run: pnpm pack:build:core
      - run: pnpm --filter @toolbox/web build
      - name: Install Playwright browsers
        run: pnpm --filter @toolbox/web exec playwright install --with-deps chromium
      # The suite starts the Go server itself (see playwright.config.ts webServer), so
      # this exercises the real response headers, CSP, SPA fallback and FTS5 search.
      - name: Run end-to-end suite
        run: pnpm --filter @toolbox/web e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  core-profile:
    name: Core Profile (all extensions disabled)
    runs-on: ubuntu-latest
    needs: [server-quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      # internal/docs validates and searches the shipped content pack, which is a
      # build product. Without it those tests skip; CI is where they must run.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/build-core-pack.mjs
      # Phase 4 requires the core image to keep working with every extension flag
      # false. Run the suite with the flags explicitly unset to prove it.
      - name: Test core profile
        env:
          TOOLBOX_TEAM_MODE: ''
          TOOLBOX_FEATURE_TYPESENSE: ''
          TOOLBOX_FEATURE_COLLABORATION: ''
          TOOLBOX_FEATURE_AI: ''
        run: go test ./... -run '.*'

  extension-profiles:
    name: Extension Profile (${{ matrix.profile }})
    runs-on: ubuntu-latest
    needs: [server-quality]
    strategy:
      fail-fast: false
      matrix:
        profile: [typesense, collaboration, ai]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      # Each extension is exercised in isolation, as the Phase 4 plan requires.
      - name: Test ${{ matrix.profile }} in isolation
        run: go test ./internal/features ./internal/config -v

  dependency-scan:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'

      # Trivy scans the image, which catches OS packages. Nothing scanned the
      # project's own dependencies, so a vulnerability in a Go module or an npm
      # package was invisible to CI. These steps close that.

      # govulncheck is pinned by version rather than installed at @latest: a
      # scanner that silently changes between runs turns a green build into an
      # unreproducible one. It reports only vulnerabilities actually reachable
      # from this code, so a finding here is a real call path rather than an
      # advisory against a package that merely appears in the graph.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Scan Go dependencies
        run: govulncheck ./...

      - run: corepack enable && corepack install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # Runtime dependencies are what reaches a user, so a high or critical
      # finding here fails the build.
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level high

      # The full tree including dev tooling is reported but does not block.
      # Blocking on it would wedge the pipeline on advisories against a test
      # runner that no user ever executes, and a permanently red gate is one
      # people learn to ignore. The report is kept as an artifact so the backlog
      # stays visible rather than invisible.
      #
      # Known outstanding: GHSA-82fw-gwwq-j7x9 (moderate) against vitest and
      # @vitest/mocker, fixed in vitest 4.1.11. Taking it means a major upgrade
      # across three workspace packages, tracked separately.
      - name: Audit all dependencies (report only)
        continue-on-error: true
        run: |
          mkdir -p artifacts
          pnpm audit --audit-level moderate --json > artifacts/npm-audit.json || true
          pnpm audit --audit-level moderate || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: npm-audit
          path: artifacts/npm-audit.json
          if-no-files-found: ignore

  docker-build-and-scan:
    name: Docker Build & Security Scans
    runs-on: ubuntu-latest
    needs: [web-quality, server-quality]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The Dockerfile copies packs/core/docs.db from the build context, and the
      # pack is generated rather than tracked. node:sqlite needs Node 22.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/build-core-pack.mjs
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: developer-toolbox:ci
      - name: Verify the published port is reachable
        # Regression guard: the image used to bind the container's own loopback, so a
        # published port connected to nothing.
        run: |
          docker run -d --name toolbox-ci -p 127.0.0.1:18080:8080 developer-toolbox:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/readyz; then
              echo "server is ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/healthz | grep -q '"status":"ok"'
          docker rm -f toolbox-ci
      - name: Measure runtime metrics
        run: ./scripts/measure-runtime.sh developer-toolbox:ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: runtime-metrics
          path: artifacts/runtime-metrics.json
          if-no-files-found: ignore
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: developer-toolbox:ci
          format: spdx-json
          output-file: artifacts/sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom
          path: artifacts/sbom.spdx.json
          if-no-files-found: ignore
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: developer-toolbox:ci
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
