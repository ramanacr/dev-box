name: Release

# Releases are cut from a tag. Nothing publishes on a branch push: the tag is the
# operator-visible decision, and everything below derives its version from it, so
# the tag, the binary's /healthz output and the image label cannot disagree.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: corepack enable && corepack install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-core-pack.mjs
      # A tag must not be able to ship something main's CI would have rejected.
      - run: pnpm --filter @toolbox/web lint
      - run: go vet ./...
      - run: go test -race ./...
      - run: pnpm -r test

  release:
    name: Build, sign and publish
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      packages: write   # push to GHCR
      id-token: write   # keyless signing via the workflow's OIDC token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # release notes are generated from commit history

      - name: Derive build identity
        id: ident
        run: |
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # RFC 3339 UTC, so the image label and the binary agree byte for byte.
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - run: corepack enable && corepack install
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27'

      - run: pnpm install --frozen-lockfile
      - name: Build the documentation pack
        run: node scripts/build-core-pack.mjs

      # --- Standalone binaries ------------------------------------------------
      # Not everyone runs the container. The same ldflags stamp is used here as in
      # the Dockerfile, so a binary and an image built from one tag report the
      # same identity.
      - name: Build release binaries
        env:
          VERSION: ${{ steps.ident.outputs.version }}
          COMMIT: ${{ steps.ident.outputs.commit }}
          BUILD_DATE: ${{ steps.ident.outputs.date }}
        run: |
          mkdir -p dist
          ldflags="-s -w"
          ldflags="$ldflags -X developer-toolbox/internal/buildinfo.version=${VERSION}"
          ldflags="$ldflags -X developer-toolbox/internal/buildinfo.commit=${COMMIT}"
          ldflags="$ldflags -X developer-toolbox/internal/buildinfo.date=${BUILD_DATE}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            name="toolbox-server_${VERSION}_${os}_${arch}${ext}"
            echo "building ${name}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="$ldflags" -o "dist/${name}" ./cmd/toolbox-server
          done
          cd dist
          sha256sum toolbox-server_* > checksums.txt
          cat checksums.txt

      # Proves the stamp landed. A release that reports "dev" on /healthz is
      # exactly the failure this workflow exists to prevent, so it fails the build
      # rather than shipping.
      - name: Verify the binary reports its version
        env:
          VERSION: ${{ steps.ident.outputs.version }}
        run: |
          binary="dist/toolbox-server_${VERSION}_linux_amd64"
          chmod +x "$binary"
          TOOLBOX_PORT=18080 TOOLBOX_BIND_ADDRESS=127.0.0.1 "$binary" &
          server_pid=$!
          trap "kill $server_pid 2>/dev/null || true" EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          body=$(curl -fsS http://127.0.0.1:18080/healthz)
          echo "$body"
          if ! echo "$body" | grep -q "\"version\":\"${VERSION}\""; then
            echo "::error::binary does not report ${VERSION}"
            exit 1
          fi

      # --- Container image ----------------------------------------------------
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ident.outputs.version }}
            COMMIT=${{ steps.ident.outputs.commit }}
            BUILD_DATE=${{ steps.ident.outputs.date }}
          # In-toto SLSA provenance, attached to the image in the registry.
          provenance: mode=max
          sbom: true

      # --- Attestation --------------------------------------------------------
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless signing: the identity is this workflow, proven by its OIDC token,
      # and the signature lands in the public transparency log. There is no key to
      # store, rotate, or leak.
      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: dist/sbom.spdx.json

      # An SBOM uploaded as a build artifact proves nothing to a third party. This
      # binds it to the image digest and signs it, so a consumer can verify the
      # bill of materials belongs to the image they are about to run.
      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate dist/sbom.spdx.json \
            --type spdxjson \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # --- GitHub release -----------------------------------------------------
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ident.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          identity="^https://github.com/${IMAGE_NAME}/"
          issuer="https://token.actions.githubusercontent.com"
          {
            echo "## Container image"
            echo
            echo "    docker pull ${REGISTRY}/${IMAGE_NAME}:${VERSION#v}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "### Verifying this release"
            echo
            echo "The image is signed keylessly by this workflow. Verify it before running it:"
            echo
            echo "    cosign verify ${REGISTRY}/${IMAGE_NAME}@${DIGEST} \\"
            echo "      --certificate-identity-regexp='${identity}' \\"
            echo "      --certificate-oidc-issuer=${issuer}"
            echo
            echo "The SBOM is attached to the same digest as a signed attestation:"
            echo
            echo "    cosign verify-attestation --type spdxjson ${REGISTRY}/${IMAGE_NAME}@${DIGEST} \\"
            echo "      --certificate-identity-regexp='${identity}' \\"
            echo "      --certificate-oidc-issuer=${issuer}"
            echo
            echo "Standalone binaries and \`checksums.txt\` are attached below."
          } > release-notes.md

          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --notes-file release-notes.md \
            dist/toolbox-server_* \
            dist/checksums.txt \
            dist/sbom.spdx.json
