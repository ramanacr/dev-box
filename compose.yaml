services:
  toolbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: developer-toolbox:dev
    container_name: developer-toolbox
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - TOOLBOX_BIND_ADDRESS=0.0.0.0
      - TOOLBOX_PORT=8080
      - TOOLBOX_USER_DOCS_DB_PATH=/app/packs/user/user-docs.db
    volumes:
      - user-docs-data:/app/packs/user
    restart: unless-stopped

  toolbox-team:
    build:
      context: .
      dockerfile: Dockerfile
    image: developer-toolbox:team
    container_name: developer-toolbox-team
    profiles:
      - team
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      - TOOLBOX_BIND_ADDRESS=0.0.0.0
      - TOOLBOX_PORT=8080
      - TOOLBOX_TEAM_MODE=true
      - TOOLBOX_OIDC_ISSUER=https://auth.example.com
      - TOOLBOX_OIDC_AUDIENCE=developer-toolbox
      - TOOLBOX_TEAM_DB_PATH=/var/lib/toolbox/workspace.db
    volumes:
      - team-workspace-data:/var/lib/toolbox
      - user-docs-data:/app/packs/user
    restart: unless-stopped

volumes:
  user-docs-data:
  team-workspace-data:
