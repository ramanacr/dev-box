services:
  typesense:
    image: typesense/typesense:27.1
    container_name: developer-toolbox-typesense
    restart: unless-stopped
    environment:
      - TYPESENSE_DATA_DIR=/data
      - TYPESENSE_API_KEY=${TYPESENSE_API_KEY:-dev-toolbox-typesense-key}
      - TYPESENSE_ENABLE_CORS=true
    volumes:
      - typesense-data:/data
    networks:
      - internal-search

networks:
  internal-search:
    internal: true

volumes:
  typesense-data:
